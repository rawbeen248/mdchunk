[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdchunker"
version = "0.1.0"
description = "Lightweight, structure-aware Markdown chunking for RAG systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rabindra Adhikari" }
]
dependencies = [
    "markdown-it-py>=3.0,<5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2"
]

[project.urls]
Homepage = "https://github.com/rawbeen248/mdchunker"
Repository = "https://github.com/rawbeen248/mdchunker"
Issues = "https://github.com/rawbeen248/mdchunker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mdchunker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes (real correctness issues).
# I: import sorting.
# B: flake8-bugbear (catches real bugs, e.g. mutable default arguments).
# RUF: ruff-specific checks.
select = ["E", "F", "I", "B", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
