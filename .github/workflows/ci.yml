name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version (pyproject.toml requires-python) plus
        # current stable versions, per PROJECT_GUIDE.md's CI/CD guidance.
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        # mypy's own config currently targets 3.10+ typing features; run it
        # once against the repo's configured interpreter rather than in
        # every matrix leg, so a 3.9 leg doesn't fail on an unrelated mypy
        # version-support message.
        if: matrix.python-version == '3.12'
        run: mypy src

      - name: Test with coverage
        run: pytest --cov=mdchunk --cov-report=term-missing

  build:
    name: verify package builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
